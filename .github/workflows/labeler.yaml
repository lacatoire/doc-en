# https://docs.github.com/en/actions

name: "Pull Request Labeler"

on:
  pull_request_target: null

permissions:
  contents: read

jobs:
  triage:
    name: "Triage"

    runs-on: "ubuntu-latest"

    permissions:
      pull-requests: write

    steps:
      - name: "Label pull request"
        uses: "actions/labeler@v7.0.0"
